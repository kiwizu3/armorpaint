name: Windows (Direct3D12)

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
    - name: Package
      if: github.event_name != 'pull_request'
      run: |
        Compress-Archive -Path paint/build/out/* -DestinationPath ArmorPaint-Windows-x64.zip
    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-x64
        path: ArmorPaint-Windows-x64.zip
    - name: Publish release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: windows-build-latest
        name: ArmorPaint Windows x64 build
        files: ArmorPaint-Windows-x64.zip
